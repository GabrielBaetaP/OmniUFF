<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento - Gestão UFF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="planejamento.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Gestão UFF - Planejamento</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="inscritas.html">Inscritas</a>
            <a href="planejamento.html" class="active">Planejamento</a>
            <a href="ranking.html">Ranking</a>
            <a href="admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <main class="admin-content">
            <div class="plan-wrapper">
                <div class="plan-topo">
                    <div>
                        <h1>Planejamento de Matérias <span id="tituloSemestre" class="semestre-tag"></span></h1>
                        <p class="dica">Cadastre as turmas oferecidas no semestre e veja, para cada aluno, a grade semanal com as escolhas dele.</p>
                    </div>
                    <div class="plan-acoes">
                        <select id="semestreSelect" title="Semestre"></select>
                        <button id="btnNovoSemestre" class="btn-neutro">+ Semestre</button>
                        <button id="btnImportarCsv" class="btn-neutro" title="Importar a tabela exportada do Notion (.csv)">Importar CSV</button>
                        <input type="file" id="arquivoCsv" accept=".csv,text/csv" class="hidden">
                        <button id="btnNovaTurma" class="btn-primary">+ Nova turma</button>
                    </div>
                </div>

                <div id="abas" class="tabs"></div>
                <div id="conteudo"></div>
            </div>
        </main>
    </div>

    <script src="common.js"></script>
    <script src="planejamento.js"></script>
</body>
</html>
